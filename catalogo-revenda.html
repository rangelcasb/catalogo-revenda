<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo do Revendedor - Bazar do Dan</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #2c1810 0%, #1a0f08 100%);
            color: #333;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .header h1 {
            color: #8B0000;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            color: #d4af37;
            font-size: 1.1em;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .category {
            margin-bottom: 50px;
        }

        .category-title {
            background: linear-gradient(90deg, #8B0000, #d4af37);
            color: white;
            padding: 15px 20px;
            font-size: 1.5em;
            font-weight: bold;
            border-radius: 5px;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .product-card {
            background: white;
            border: 3px solid #d4af37;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(212, 175, 55, 0.4);
        }

        .product-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: #f5f5f5;
        }

        .product-info {
            padding: 15px;
            text-align: center;
        }

        .product-name {
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
            font-size: 0.95em;
        }

        .product-unit {
            font-size: 0.85em;
            color: #666;
            margin-bottom: 10px;
        }

        .product-price {
            font-size: 1.3em;
            color: #8B0000;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .btn-buy {
            background: linear-gradient(135deg, #8B0000, #d4af37);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.3s;
            width: 100%;
        }

        .btn-buy:hover {
            opacity: 0.9;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
        }

        .modal-content {
            background-color: white;
            margin: 10% auto;
            padding: 30px;
            border-radius: 10px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            animation: slideIn 0.3s ease-in-out;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #d4af37;
            padding-bottom: 15px;
        }

        .modal-header h2 {
            color: #8B0000;
        }

        .close {
            font-size: 28px;
            font-weight: bold;
            color: #aaa;
            cursor: pointer;
            background: none;
            border: none;
        }

        .close:hover {
            color: #8B0000;
        }

        .modal-body {
            margin-bottom: 20px;
        }

        .modal-body p {
            margin-bottom: 10px;
            color: #666;
        }

        .quantity-selector {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
        }

        .quantity-btn {
            background: #d4af37;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2em;
            font-weight: bold;
            color: white;
            transition: background 0.3s;
        }

        .quantity-btn:hover {
            background: #8B0000;
        }

        .quantity-input {
            width: 80px;
            padding: 10px;
            text-align: center;
            font-size: 1.2em;
            border: 2px solid #d4af37;
            border-radius: 5px;
            font-weight: bold;
        }

        .modal-footer {
            display: flex;
            gap: 10px;
        }

        .btn-modal {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1em;
            transition: opacity 0.3s;
        }

        .btn-send {
            background: linear-gradient(135deg, #8B0000, #d4af37);
            color: white;
        }

        .btn-send:hover {
            opacity: 0.9;
        }

        .btn-cancel {
            background: #ccc;
            color: #333;
        }

        .btn-cancel:hover {
            opacity: 0.8;
        }

        .total-price {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 5px;
            text-align: center;
            margin: 20px 0;
            font-size: 1.2em;
        }

        .total-price strong {
            color: #8B0000;
        }

        footer {
            text-align: center;
            margin-top: 50px;
            padding: 20px;
            color: #d4af37;
            font-size: 0.9em;
        }

        @media (max-width: 768px) {
            .products-grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                gap: 15px;
            }

            .header h1 {
                font-size: 1.8em;
            }

            .modal-content {
                margin: 30% auto;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎆 Bazar do Dan</h1>
        <h2>Catálogo do Revendedor</h2>
        <p>Selecione os produtos e envie seu pedido pelo WhatsApp</p>
    </div>

    <div class="container" id="container"></div>

    <footer>
        <p>📞 Contato: <strong>(82) 99945-3211</strong></p>
        <p>💬 Envie seu pedido pelo WhatsApp e receba uma confirmação em breve</p>
    </footer>

    <!-- Modal -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Produto</h2>
                <button class="close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <p id="modal-unit"></p>
                <p id="modal-price"></p>
                
                <div class="quantity-selector">
                    <button class="quantity-btn" onclick="decreaseQuantity()">−</button>
                    <input type="number" id="quantity-input" class="quantity-input" value="1" min="1">
                    <button class="quantity-btn" onclick="increaseQuantity()">+</button>
                </div>

                <div class="total-price">
                    Total: <strong id="modal-total">R$ 0,00</strong>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-modal btn-send" onclick="sendToWhatsApp()">
                    📱 Enviar Pedido
                </button>
                <button class="btn-modal btn-cancel" onclick="closeModal()">
                    Cancelar
                </button>
            </div>
        </div>
    </div>

    <script>
        const WHATSAPP_NUMBER = '5582999453211';

        const products = [

            { id: 10, name: 'Traque Gurizinho', unit: 'Cx 20 (30un cada)', price: 46.00, category: 'Traques' },
            { id: 11, name: 'Traque Guri', unit: 'Cx 10 (80un cada)', price: 52.00, category: 'Traques' },
            { id: 12, name: 'Traque Redondo', unit: 'Cx 10 (25un cada)', price: 11.00, category: 'Traques' },
            
            // MAIS ESTALOS

            { id: 17, name: 'Chispinha', unit: 'Pacote 6 unidades', price: 4.50, category: 'Estalos' },
            
            // VOADORES
            { id: 18, name: 'Libélula', unit: 'Cx 12', price: 18.00, category: 'Voadores' },

            // BOMBAS
            { id: 28, name: 'Bomba Nº0', unit: '1 unidade', price: 0.20, category: 'Bombas' },

            // CHUVINHAS
            { id: 40, name: 'Chuvinha P', unit: 'Pct 12', price: 3.50, category: 'Chuvinhas' },

            { id: 45, name: 'Chuva Colorida', unit: 'Cx 20', price: 24.50, category: 'Chuvinhas' },
            { id: 46, name: 'Vela Magnesiana P', unit: 'Cx 10', price: 15.50, category: 'Chuvinhas' },
            { id: 47, name: 'Vela Magnesiana M', unit: 'Cx 10', price: 13.00, category: 'Chuvinhas' },
            
            // ESPECIAIS
            { id: 48, name: 'Candelas 10t', unit: 'Cx12', price: 32.50, category: 'Especiais' },
            { id: 49, name: 'Candelas 20t', unit: 'Cx12', price: 45.50, category: 'Especiais' },
            { id: 50, name: 'Candelas 30t', unit: 'Cx12', price: 56.00, category: 'Especiais' },

            { id: 55, name: '3 Tiros Canhão', unit: 'Cx12', price: 28.00, category: 'Especiais' },
            { id: 56, name: 'Carrinho', unit: '1 unidade', price: 5.00, category: 'Especiais' },
            { id: 57, name: 'Granada c/Istumpim', unit: '1 unidade', price: 5.00, category: 'Especiais' },
            { id: 58, name: 'Apito Vara', unit: '12un', price: 26.00, category: 'Especiais' },
            { id: 59, name: 'Piaozinho Cx12', unit: 'Cx12', price: 18.00, category: 'Especiais' },
            { id: 60, name: 'Piaozinho Cx20', unit: 'Cx com 20 unidades', price: 26.00, category: 'Especiais' },
            { id: 61, name: 'Torpedão', unit: 'Cx6', price: 78.00, category: 'Especiais' },
            { id: 62, name: 'Árvore de Natal', unit: 'Cx6', price: 21.00, category: 'Especiais' },
        ];

        function renderProducts() {
            const container = document.getElementById('container');
            const categories = [...new Set(products.map(p => p.category))];

            categories.forEach(cat => {
                const categoryProducts = products.filter(p => p.category === cat);
                const categoryHTML = `
                    <div class="category">
                        <div class="category-title">${cat}</div>
                        <div class="products-grid">
                            ${categoryProducts.map(product => `
                                <div class="product-card" onclick="openModal(${product.id})">
                                    <div class="product-image" style="background: linear-gradient(135deg, #2c1810 0%, #1a0f08 100%); display: flex; align-items: center; justify-content: center;">
                                        <div style="color: #d4af37; text-align: center; font-size: 0.9em;">
                                            <div style="font-weight: bold;">${product.name}</div>
                                            <div style="font-size: 0.8em; margin-top: 5px;">${product.unit}</div>
                                        </div>
                                    </div>
                                    <div class="product-info">
                                        <div class="product-name">${product.name}</div>
                                        <div class="product-unit">${product.unit}</div>
                                        <div class="product-price">R$ ${product.price.toFixed(2)}</div>
                                        <button class="btn-buy">Solicitar</button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
                container.innerHTML += categoryHTML;
            });
        }

        function openModal(productId) {
            currentProduct = products.find(p => p.id === productId);
            if (!currentProduct) return;

            document.getElementById('modal-title').textContent = currentProduct.name;
            document.getElementById('modal-unit').textContent = `📦 ${currentProduct.unit}`;
            document.getElementById('modal-price').textContent = `💰 Preço unitário: R$ ${currentProduct.price.toFixed(2)}`;
            document.getElementById('quantity-input').value = 1;
            updateTotal();

            document.getElementById('modal').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
            currentProduct = null;
        }

        function increaseQuantity() {
            const input = document.getElementById('quantity-input');
            input.value = parseInt(input.value) + 1;
            updateTotal();
        }

        function decreaseQuantity() {
            const input = document.getElementById('quantity-input');
            if (parseInt(input.value) > 1) {
                input.value = parseInt(input.value) - 1;
                updateTotal();
            }
        }

        function updateTotal() {
            if (!currentProduct) return;
            const quantity = parseInt(document.getElementById('quantity-input').value);
            const total = currentProduct.price * quantity;
            document.getElementById('modal-total').textContent = `R$ ${total.toFixed(2)}`;
        }

        function sendToWhatsApp() {
            if (!currentProduct) return;
            
            const quantity = parseInt(document.getElementById('quantity-input').value);
            const total = (currentProduct.price * quantity).toFixed(2);
            
            const message = `Pedido de Revenda:\n\n` +
                `📦 *${quantity}x ${currentProduct.name}*\n` +
                `📊 Quantidade: ${quantity}\n` +
                `💲 Preço unitário: R$ ${currentProduct.price.toFixed(2)}\n` +
                `📍 ${currentProduct.unit}\n\n` +
                `*Total: R$ ${total}*\n\n` +
                `Data: ${new Date().toLocaleDateString('pt-BR')}`;
            
            const encodedMessage = encodeURIComponent(message);
            const whatsappUrl = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodedMessage}`;
            
            window.open(whatsappUrl, '_blank');
            closeModal();
        }

        // Fechar modal ao clicar fora
        window.onclick = function(event) {
            const modal = document.getElementById('modal');
            if (event.target === modal) {
                closeModal();
            }
        }

        // Renderizar produtos ao carregar
        document.addEventListener('DOMContentLoaded', renderProducts);
    </script>
</body>
</html>
